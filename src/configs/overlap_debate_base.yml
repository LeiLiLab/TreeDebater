# Example: overlapping streaming listen + streaming TTS (see streaming/overlap.py; run: python -m streaming.overlap).
# Both sides must be treedebater for per-turn StreamingInputEnv; set streaming_listen on listeners.

env:
  motion: Learning to be a good writer still matters in the age of ai
  judge_num: 1
  audience_num: 3
  claim_pool_size: 50
  reverse: False
  time_control: True

debater:
  - side: for
    model: deepseek-chat
    type: baseline
    url: http://127.0.0.1:8082/
    temperature: 1.0
    helper_model: deepseek-chat
    streaming_tts: False
    streaming_listen: False

  - side: against
    model: deepseek-chat
    type: baseline
    url: http://127.0.0.1:8082/
    temperature: 1.0
    use_retrieval: True
    helper_model: deepseek-chat
    streaming_tts: False
    streaming_listen: False

judge:
  temperature: 0.0

audience:
  temperature: 1

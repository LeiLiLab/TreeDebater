# Server environment before starting backend:
# DEBATE_LLM_API_BASE=http://127.0.0.1:4000/v1
# Text models use the proxy; ASR and TTS still use their existing providers.
motion: Learning to be a good writer still matters in the age of AI
mode: human_ai
human_side: for
first_side: for
engine: treedebater
ai_model: google.gemma-4-26b-a4b
helper_model: google.gemma-4-26b-a4b
planning:
  mode: adaptive_tree
  max_plan_tokens: 700
  max_gate_tokens: 120
  max_updates: 24
  max_wait_chunks: 3
claim_pool_size: 4
budgets:
  opening: 60
  rebuttal: 60
  closing: 30
evaluation: false

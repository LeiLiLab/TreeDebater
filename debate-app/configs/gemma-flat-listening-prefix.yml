# Import to prepare a stable overview and provisional body during opponent input.
# Each published overview version must pass semantic review before TTS.
# All text generation and feedback use the configured Gemma model.
# This web preset differs from the v70 harness and still needs web end-to-end acceptance.
motion: Learning to be a good writer still matters in the age of AI
mode: human_ai
human_side: for
first_side: for
engine: treedebater
ai_model: google.gemma-4-26b-a4b
helper_model: google.gemma-4-26b-a4b
rehearsal:
  enabled: true
  pool_name: gemma-4-26b-a4b
  mode: hybrid
planning:
  mode: flat_tree
  max_plan_tokens: 1100
  max_gate_tokens: 120
  max_updates: 24
  max_wait_chunks: 3
claim_pool_size: 4
claim_selection_strategy: saved_scores
budgets:
  opening: 240
  rebuttal: 240
  closing: 120
streaming:
  output:
    speech_mode: listening_prefix
    audience_feedback_mode: compact
    listening_prefix_max_rewrites: 2
    listening_prefix_max_calls: 48
    listening_body_update_words: 100
    listening_prefix_pre_synthesize: true
    listening_planning_timeout_seconds: 6
    budget_mode: audio_duration
    adaptive_delivery: true
    min_chunk_words: 50
    max_stream_chunks: 5
    first_chunk_seconds: 16
    # Keep normal body paragraphs and proportional duration allocation.
    first_body_chunk_seconds: 0
    first_chunk_local_tempo: false
    allow_expansion: true
    refinement_model: google.gemma-4-26b-a4b
    early_max_refinements: 3
    max_refinements: 10
    max_parallel_tts: 8
    speed_adjust_min: 1
    speed_adjust_max: 1
evaluation: false
